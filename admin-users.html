<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Management - ScaleGrid Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-container">
    <aside class="sidebar">
      <div class="brand"><h2>ScaleGrid</h2></div>
      <nav class="nav-menu">
        <a href="index.html" class="nav-btn">📊 Dashboard</a>
        <div class="nav-section-title">Website Control</div>
        <a href="https://fmd147726-crypto.github.io/ScalwGrid/" target="_blank" class="nav-btn">🔗 Visit Site</a>
        <div class="nav-section-title">Tools & Assets</div>
        <a href="https://postimages.org" target="_blank" class="nav-btn">🖼️ PostImages</a>
        <div class="nav-section-title">Categories</div>
        <a href="ads.html" class="nav-btn">📢 Ads & Campaigns</a>
        <a href="automations.html" class="nav-btn">⚡ Automations</a>
        <a href="websites.html" class="nav-btn">🌐 Websites</a>
        <a href="apps.html" class="nav-btn">📱 Apps</a>
        <div class="nav-section-title">System</div>
        <a href="notifications.html" class="nav-btn">🔔 Notifications</a>
        <a href="admin-users.html" class="nav-btn active">👥 Admin Users</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Admin <span>Management</span></h1>
        <a href="index.html" class="btn-secondary" style="text-decoration:none;">← Back to Dashboard</a>
      </header>

      <div style="display: flex; gap: 10px; margin-bottom: 25px;">
        <button class="btn-primary" onclick="addSuperAdmin()">+ Add Super Admin</button>
        <button class="btn-secondary" onclick="addNormalAdmin()">+ Add Normal Admin</button>
      </div>

      <section class="categories-section">
        <h3 style="color: #ffd700; margin-bottom: 10px; font-size: 1rem;">👑 Super Admins</h3>
        <div id="superAdminsList">
          <!-- Dynamically loaded super admins will appear here -->
        </div>

        <h3 style="color: var(--accent-neon); margin: 25px 0 10px 0; font-size: 1rem;">🔧 Normal Admins</h3>
        <div id="normalAdminsList">
          <!-- Dynamically loaded normal admins will appear here -->
        </div>
      </section>
    </main>
  </div>

  <!-- Dynamic Permissions Modal (Hidden by Default) -->
  <div id="permissionsModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h3 style="color: var(--accent-neon); margin-bottom: 15px;">Manage Admin Permissions</h3>
      <p id="modalAdminEmail" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;"></p>
      
      <div id="permissionsListContainer" style="display: flex; flex-direction: column; gap: 12px; max-height: 250px; overflow-y: auto; margin-bottom: 20px;">
        <!-- Dynamic permission checkboxes will render here -->
        <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox" data-perm="pricing" style="width: 18px; height: 18px;"> Allow Managing Packages & Pricing
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox" data-perm="sections" style="width: 18px; height: 18px;"> Allow Changing Page Section Layout & Visibility
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox" data-perm="portfolio" style="width: 18px; height: 18px;"> Allow Adding/Editing Portfolio Items
        </label>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 0.9rem; cursor: pointer;">
          <input type="checkbox" data-perm="faqs" style="width: 18px; height: 18px;"> Allow Managing FAQs
        </label>
      </div>

      <!-- Option to add future custom permission rules dynamically -->
      <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-bottom: 20px; display: flex; gap: 8px;">
        <input type="text" id="newPermissionKey" placeholder="New permission key (e.g. banners)" style="padding: 6px; font-size: 0.85rem;">
        <button class="btn-secondary" onclick="addNewPermissionRule()">+ Add Rule</button>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 10px;">
        <button class="btn-secondary" onclick="closePermissionsModal()">Cancel</button>
        <button class="btn-primary" onclick="saveAdminPermissions()">Save Permissions</button>
      </div>
    </div>
  </div>

  <!-- Initialize Firebase and bind window.db before loading admin.js -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBbHGhDzDXDOlSTRlukZruFzeTZmPOyaCw",
      authDomain: "scalegrid-1c506.firebaseapp.com",
      databaseURL: "https://scalegrid-1c506-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "scalegrid-1c506",
      storageBucket: "scalegrid-1c506.firebasestorage.app",
      messagingSenderId: "594287186699",
      appId: "1:594287186699:web:a26661c6ca221e4fbbc80e",
      measurementId: "G-3C9NZ9THCQ"
    };
    const app = initializeApp(firebaseConfig);
    window.db = getDatabase(app);
  </script>

  <script type="module" src="admin.js"></script>
</body>
</html>
